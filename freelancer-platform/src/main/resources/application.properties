spring.application.name=freelancer-platform

# Server Configuration
server.port=${PORT:8080}

# Database Configuration (supports external environment variables for cloud deployment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/freelancer_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}

# JPA / Hibernate Configuration (safe non-destructive schema update)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# JWT Security Configuration
# In production, set the JWT_SECRET environment variable to a secure 256-bit+ secret.
jwt.secret=${JWT_SECRET:c2VjdXJlX2RldmVsb3BtZW50X2tleV9mb3JfZnJlZWxhbmNlcl9wbGF0Zm9ybV9jYXBzdG9uZV9wcm9qZWN0XzIwMjZfMjU2Yml0cw==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins (supports FRONTEND_URL, CORS_ALLOWED_ORIGINS, and defaults for development & production)
app.cors.allowed-origins=${FRONTEND_URL:${CORS_ALLOWED_ORIGINS:https://freelancer-platform-nine.vercel.app,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}}

# Email Security Notification Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:noreply@freelancerplatform.com}